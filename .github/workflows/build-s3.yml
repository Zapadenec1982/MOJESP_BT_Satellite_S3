# Firmware build for the esp32s3 target (boards/s3_player, headless) in the official ESP-IDF
# container — the same image and the same checks as build-p4.yml.
#
# The S3 has its own lock file, dependencies.lock.esp32s3 (root CMakeLists.txt sets
# DEPENDENCIES_LOCK per target), so the two targets never rewrite each other's resolution.
name: build-s3

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-s3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # components/etl/etl

      - name: Let git work on a checkout owned by another uid (container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Python deps for tools/generate_ui.py (runs at CMake configure time)
        run: |
          . "$IDF_PATH/export.sh"
          python -m pip install -r tools/requirements.txt

      - name: Build for esp32s3
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build_s3 -D SDKCONFIG=build_s3/sdkconfig set-target esp32s3
          idf.py -B build_s3 -D SDKCONFIG=build_s3/sdkconfig build

      - name: Lock file honoured (the resolved set is the committed one)
        run: git diff --exit-code -- dependencies.lock.esp32s3 dependencies.lock

      - name: Size report
        run: |
          . "$IDF_PATH/export.sh"
          mkdir -p size-report
          idf.py -B build_s3 -D SDKCONFIG=build_s3/sdkconfig size | tee size-report/size.txt
          {
            echo
            echo "== images =="
            ls -l build_s3/*.bin build_s3/bootloader/*.bin build_s3/partition_table/*.bin
          } | tee -a size-report/size.txt
          cp build_s3/project_description.json size-report/
          cp dependencies.lock.esp32s3 size-report/

      - uses: actions/upload-artifact@v4
        with:
          name: size-report-esp32s3
          path: size-report/
          if-no-files-found: error
