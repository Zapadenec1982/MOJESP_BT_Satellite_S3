dependencies:
  # HAP pairing: SRP-6a, Ed25519, X25519, ChaCha20-Poly1305. Upstream's lock at 811d5f8
  # (UPSTREAM.md). Built from source, so there is no prebuilt archive to check for
  # instructions this board's P4 v1.3 lacks.
  espressif/libsodium: "==1.0.21"
  # ALAC and AAC. Pinned below 2.6 exactly as modules/player and modules/radio are: 2.6
  # needs chip revision 3.0.
  espressif/esp_audio_codec: ">=2.0.0,<2.6.0"
  # Advertisement, and the DACP client's lookup of the phone. The player already carries it
  # (modesp_net); the same constraint as there.
  espressif/mdns: ">=1.3.2"
