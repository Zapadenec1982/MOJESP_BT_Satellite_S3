<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <style>
      .h1 { font-weight:600; font-size:18px; fill:#111827; }
      .sub { fill:#6B7280; font-size:12px; }
      .title { font-weight:600; font-size:14px; fill:#111827; }
      .pin { font-size:13px; font-weight:600; }
      .role { font-size:12.5px; fill:#374151; }
      .roleb { font-size:12.5px; fill:#374151; font-weight:600; }
      .was { font-size:11px; fill:#B45309; font-weight:600; }
      .note { font-size:12px; fill:#374151; }
      .warn { font-size:12px; fill:#B45309; font-weight:600; }
      .box { fill:#FFFFFF; stroke:#1F2937; stroke-width:1.5; }
    </style>
  </defs>
  <rect width="1400" height="800" fill="#F8FAFC"/>

  <text x="30" y="32" class="h1">JP1 — розташування контактів і призначення сигналів (узгоджено 16.09.2026)</text>
  <text x="30" y="52" class="sub">Кольори контактів — як на фото гребінки. Кольорова смуга збоку = один джгут до одного модуля. Три контакти переставлені (жовтим — як було до 16.09),</text>
  <text x="30" y="70" class="sub">щоб кожен джгут лежав одним блоком. Піни 34/35 — strapping, тому на них лишаються mute і кнопка, а не клоки (CONCEPT §4).</text>

  <!-- connector body -->
  <rect x="470" y="96" width="130" height="484" fill="#2B2B2B" rx="4"/>
  <text x="535" y="90" text-anchor="middle" class="sub" fill="#374151">JP1 · 2×13</text>

  <!-- ======================= ROWS ======================= -->
  <!-- y = 104 + i*36 ; box h = 32 -->

  <!-- row 0 -->
  <rect x="300" y="104" width="170" height="32" fill="#E23B2E" rx="3"/><text x="385" y="125" text-anchor="middle" class="pin" fill="#FFFFFF">3V3</text>
  <rect x="600" y="104" width="170" height="32" fill="#E23B2E" rx="3"/><text x="685" y="125" text-anchor="middle" class="pin" fill="#FFFFFF">5V</text>
  <text x="258" y="125" text-anchor="end" class="roleb">енкодер «+»</text>
  <text x="812" y="125" class="roleb">→ аналоговий LDO 3V3</text>
  <!-- row 1 -->
  <rect x="300" y="140" width="170" height="32" fill="#E23B2E" rx="3"/><text x="385" y="161" text-anchor="middle" class="pin" fill="#FFFFFF">3V3</text>
  <rect x="600" y="140" width="170" height="32" fill="#E23B2E" rx="3"/><text x="685" y="161" text-anchor="middle" class="pin" fill="#FFFFFF">5V</text>
  <text x="258" y="161" text-anchor="end" class="role">резерв</text>
  <text x="812" y="161" class="role">≤ 200–300 мА сумарно</text>
  <!-- row 2 -->
  <rect x="300" y="176" width="170" height="32" fill="#111111" rx="3"/><text x="385" y="197" text-anchor="middle" class="pin" fill="#FFFFFF">GND</text>
  <rect x="600" y="176" width="170" height="32" fill="#111111" rx="3"/><text x="685" y="197" text-anchor="middle" class="pin" fill="#FFFFFF">GND</text>
  <text x="258" y="197" text-anchor="end" class="role">земля аналогу</text>
  <text x="812" y="197" class="role">земля енкодера</text>
  <!-- row 3 -->
  <rect x="300" y="212" width="170" height="32" fill="#7BC96F" rx="3"/><text x="385" y="233" text-anchor="middle" class="pin">GPIO52</text>
  <rect x="600" y="212" width="170" height="32" fill="#7BC96F" rx="3"/><text x="685" y="233" text-anchor="middle" class="pin">GPIO33</text>
  <text x="258" y="233" text-anchor="end" class="roleb">I2S-A DOUT → ЦАП DIN</text>
  <text x="812" y="233" class="role">BT BCLK (пізніше)</text>
  <text x="960" y="233" class="was">було: енкодер DT</text>
  <!-- row 4 -->
  <rect x="300" y="248" width="170" height="32" fill="#7BC96F" rx="3"/><text x="385" y="269" text-anchor="middle" class="pin">GPIO51</text>
  <rect x="600" y="248" width="170" height="32" fill="#7BC96F" rx="3"/><text x="685" y="269" text-anchor="middle" class="pin">GPIO31</text>
  <text x="258" y="269" text-anchor="end" class="roleb">LRCK → ЦАП + АЦП</text>
  <text x="812" y="269" class="role">BT LRCLK (пізніше)</text>
  <!-- row 5 -->
  <rect x="300" y="284" width="170" height="32" fill="#7BC96F" rx="3"/><text x="385" y="305" text-anchor="middle" class="pin">GPIO50</text>
  <rect x="600" y="284" width="170" height="32" fill="#7BC96F" rx="3"/><text x="685" y="305" text-anchor="middle" class="pin">GPIO30</text>
  <text x="258" y="305" text-anchor="end" class="roleb">BCK → ЦАП + АЦП</text>
  <text x="812" y="305" class="role">BT DATA (пізніше)</text>
  <!-- row 6 -->
  <rect x="300" y="320" width="170" height="32" fill="#7BC96F" rx="3"/><text x="385" y="341" text-anchor="middle" class="pin">GPIO49</text>
  <rect x="600" y="320" width="170" height="32" fill="#7BC96F" rx="3"/><text x="685" y="341" text-anchor="middle" class="pin">GPIO29</text>
  <text x="258" y="341" text-anchor="end" class="roleb">MCLK → АЦП SCK</text>
  <text x="812" y="341" class="roleb">I2S-A DIN ← АЦП OUT</text>
  <text x="960" y="341" class="was">було: BT BCLK</text>
  <!-- row 7 -->
  <rect x="300" y="356" width="170" height="32" fill="#7BC96F" rx="3"/><text x="385" y="377" text-anchor="middle" class="pin">GPIO35</text>
  <rect x="600" y="356" width="170" height="32" fill="#111111" rx="3"/><text x="685" y="377" text-anchor="middle" class="pin" fill="#FFFFFF">GND</text>
  <text x="258" y="377" text-anchor="end" class="roleb">енкодер SW</text>
  <text x="812" y="377" class="role">земля I2S (ЦАП / АЦП)</text>
  <!-- row 8 -->
  <rect x="300" y="392" width="170" height="32" fill="#7BC96F" rx="3"/><text x="385" y="413" text-anchor="middle" class="pin">GPIO34</text>
  <rect x="600" y="392" width="170" height="32" fill="#F5A623" rx="3"/><text x="685" y="413" text-anchor="middle" class="pin">ESP_3V3</text>
  <text x="258" y="413" text-anchor="end" class="roleb">amp_enable / XSMT</text>
  <text x="812" y="413" class="role">не чіпати (призначення уточнити)</text>
  <!-- row 9 -->
  <rect x="300" y="428" width="170" height="32" fill="#7BC96F" rx="3"/><text x="385" y="449" text-anchor="middle" class="pin">GPIO32</text>
  <rect x="600" y="428" width="170" height="32" fill="#4FC3F7" rx="3"/><text x="685" y="449" text-anchor="middle" class="pin">C6_U0RXD</text>
  <text x="258" y="449" text-anchor="end" class="roleb">енкодер CLK</text>
  <text x="812" y="449" class="role">консоль C6 — тільки для відновлення</text>
  <!-- row 10 -->
  <rect x="300" y="464" width="170" height="32" fill="#7BC96F" rx="3"/><text x="385" y="485" text-anchor="middle" class="pin">GPIO28</text>
  <rect x="600" y="464" width="170" height="32" fill="#4FC3F7" rx="3"/><text x="685" y="485" text-anchor="middle" class="pin">C6_U0TXD</text>
  <text x="258" y="485" text-anchor="end" class="roleb">енкодер DT</text>
  <text x="120" y="485" class="was">було: I2S-A DIN</text>
  <text x="812" y="485" class="role">(docs/C6_UPDATE.md §5)</text>
  <!-- row 11 -->
  <rect x="300" y="500" width="170" height="32" fill="#CE93F5" rx="3"/><text x="385" y="521" text-anchor="middle" class="pin">I2C_SDA</text>
  <rect x="600" y="500" width="170" height="32" fill="#4FC3F7" rx="3"/><text x="685" y="521" text-anchor="middle" class="pin">C6_IO9</text>
  <text x="258" y="521" text-anchor="end" class="role">MCP23017 (пізніше)</text>
  <!-- row 12 -->
  <rect x="300" y="536" width="170" height="32" fill="#CE93F5" rx="3"/><text x="385" y="557" text-anchor="middle" class="pin">I2C_SCL</text>
  <rect x="600" y="536" width="170" height="32" fill="#4FC3F7" rx="3"/><text x="685" y="557" text-anchor="middle" class="pin">C6_CHIP_PU</text>
  <text x="258" y="557" text-anchor="end" class="role">спільна з тачем і кодеком</text>

  <!-- ======================= GROUP BARS ======================= -->
  <!-- left bars at x=272 -->
  <rect x="272" y="212" width="8" height="140" fill="#2E7FD6" rx="4"/>
  <rect x="272" y="356" width="8" height="32"  fill="#8E5BD6" rx="4"/>
  <rect x="272" y="392" width="8" height="32"  fill="#D9453D" rx="4"/>
  <rect x="272" y="428" width="8" height="68"  fill="#8E5BD6" rx="4"/>
  <rect x="272" y="104" width="8" height="32"  fill="#8E5BD6" rx="4"/>
  <rect x="272" y="500" width="8" height="68"  fill="#C026D3" rx="4"/>
  <!-- right bars at x=790 -->
  <rect x="790" y="104" width="8" height="68"  fill="#E08A1E" rx="4"/>
  <rect x="790" y="176" width="8" height="32"  fill="#8E5BD6" rx="4"/>
  <rect x="790" y="212" width="8" height="104" fill="#9CA3AF" rx="4"/>
  <rect x="790" y="320" width="8" height="32"  fill="#2E7FD6" rx="4"/>
  <rect x="790" y="356" width="8" height="32"  fill="#2E7FD6" rx="4"/>
  <rect x="790" y="428" width="8" height="140" fill="#6B7280" rx="4"/>
  <rect x="272" y="176" width="8" height="32"  fill="#2E7FD6" rx="4"/>

  <!-- ======================= WHY ======================= -->
  <rect x="30" y="600" width="640" height="170" class="box" rx="8"/>
  <text x="46" y="624" class="title">Що дала перестановка трьох контактів</text>
  <text x="46" y="648" class="note">• <tspan font-weight="600">Аудіо-джгут — один блок, рядки 4–7.</tspan> ЦАП бере DOUT/LRCK/BCK з лівої</text>
  <text x="46" y="664" class="note">  колонки поспіль; АЦП — LRCK/BCK/MCLK звідти ж і віддає дані</text>
  <text x="46" y="680" class="note">  навпроти (GPIO29), а не через усю колодку.</text>
  <text x="46" y="702" class="note">• <tspan font-weight="600">Енкодер — рядки 8, 10, 11 + живлення зверху</tspan> замість «CLK ліворуч,</text>
  <text x="46" y="718" class="note">  DT на протилежному боці».</text>
  <text x="46" y="740" class="note">• <tspan font-weight="600">BT отримує три сусідні контакти праворуч (33/31/30)</tspan> — коли прийде</text>
  <text x="46" y="756" class="note">  керована плата, її джгут теж буде один шлейф.</text>

  <rect x="690" y="600" width="680" height="170" class="box" rx="8"/>
  <text x="706" y="624" class="title">Легенда джгутів і що лишається як було</text>
  <rect x="706" y="636" width="14" height="12" fill="#2E7FD6"/><text x="728" y="647" class="note">I2S-A: ЦАП PCM5102A + АЦП PCM1808 (спільні LRCK/BCK)</text>
  <rect x="706" y="658" width="14" height="12" fill="#8E5BD6"/><text x="728" y="669" class="note">енкодер (CLK/DT/SW + «+» 3V3 + GND)</text>
  <rect x="706" y="680" width="14" height="12" fill="#D9453D"/><text x="728" y="691" class="note">amp_enable → TPA3255 /RESET + PCM5102A XSMT</text>
  <rect x="706" y="702" width="14" height="12" fill="#9CA3AF"/><text x="728" y="713" class="note">BT — зарезервовано, поки не прийде керована плата</text>
  <rect x="706" y="724" width="14" height="12" fill="#C026D3"/><text x="728" y="735" class="note">ES_I2C → MCP23017 (спільна з тачем і кодеком панелі)</text>
  <rect x="706" y="746" width="14" height="12" fill="#6B7280"/><text x="728" y="757" class="note">консоль C6 — не чіпати, це шлях відновлення</text>

  <text x="30" y="790" class="warn">Застосовано: boards/p4_player/board.json і docs/CONCEPT.md §4 оновлені 16.09.2026.</text>
</svg>
