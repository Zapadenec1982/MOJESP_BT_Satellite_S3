<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1345 980" width="1345" height="980" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7FD6"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2FA457"/></marker>
    <marker id="aOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E08A1E"/></marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9453D"/></marker>
    <marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker>
    <marker id="aWire" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <style>
      .box { fill:#FFFFFF; stroke:#1F2937; stroke-width:1.5; }
      .mod { fill:#FFFFFF; stroke:#1F2937; stroke-width:1.5; }
      .title { font-weight:600; font-size:15px; fill:#111827; }
      .sub { fill:#6B7280; font-size:11.5px; }
      .w { fill:none; stroke-width:2; }
      .blue { stroke:#2E7FD6; } .green { stroke:#2FA457; } .orange { stroke:#E08A1E; }
      .red { stroke:#D9453D; } .gray { stroke:#6B7280; }
      .wgreen { stroke:#22A04A; } .wyellow { stroke:#E3C019; } .worange { stroke:#EE8B2B; }
      .wred { stroke:#D9453D; } .wbrown { stroke:#8B5E3C; }
      .lbl { font-size:11.5px; fill:#374151; }
      .note { font-size:12px; fill:#374151; }
      .warn { font-size:12px; fill:#B45309; font-weight:600; }
      .pad { fill:#111827; }
      .silk { font-size:11px; fill:#111827; font-weight:600; }
    </style>
  </defs>

  <rect width="1345" height="980" fill="#F8FAFC"/>
  <text x="30" y="34" class="title" font-size="18">P4 Player — підключення до JP1: PCM5102A, PCM1808 (CJMCU), QCC5125, енкодер</text>
  <text x="30" y="54" class="sub">Два дроти даних ідуть у ПРОТИЛЕЖНІ боки: GPIO52 → «DIN» ЦАПа, «OUT» АЦП → GPIO29. Переплутати їх — гучний шум (стенд 16.09.2026). GPIO за docs/CONCEPT.md §4/§5. Номери контактів гребінки JP1 для цих GPIO в CONCEPT не задані — звірити зі схемою панелі. Назви пінів модулів — за шовкографією з фото.</text>

  <!-- ================= ESP32-P4 / JP1 ================= -->
  <rect x="450" y="80" width="360" height="650" class="box" rx="8"/>
  <text x="630" y="106" text-anchor="middle" class="title">ESP32-P4 · гребінка JP1</text>
  <text x="630" y="124" text-anchor="middle" class="sub">I2S-A: майстер 48 кГц, 32-бітні слоти (BCK = 64fs)</text>

  <g class="pad">
    <circle cx="810" cy="160" r="4"/><circle cx="810" cy="190" r="4"/><circle cx="810" cy="220" r="4"/>
    <circle cx="810" cy="250" r="4"/><circle cx="810" cy="300" r="4"/><circle cx="810" cy="360" r="4"/>
    <circle cx="810" cy="610" r="4"/><circle cx="810" cy="640" r="4"/><circle cx="810" cy="670" r="4"/>
    <circle cx="450" cy="250" r="4"/><circle cx="450" cy="280" r="4"/><circle cx="450" cy="310" r="4"/>
    <circle cx="450" cy="350" r="4"/><circle cx="450" cy="380" r="4"/>
    <circle cx="500" cy="710" r="4"/><circle cx="590" cy="710" r="4"/>
  </g>
  <g fill="#111827">
    <text x="800" y="164" text-anchor="end">GPIO49 · MCLK 12,288 МГц</text>
    <text x="800" y="194" text-anchor="end">GPIO50 · BCK 3,072 МГц</text>
    <text x="800" y="224" text-anchor="end">GPIO51 · LRCK 48 кГц</text>
    <text x="800" y="254" text-anchor="end">GPIO52 · DOUT → DAC</text>
    <text x="800" y="304" text-anchor="end">GPIO34 · amp_enable (LOW = mute)</text>
    <text x="800" y="364" text-anchor="end">GPIO29 · DIN ← ADC</text>
    <text x="800" y="614" text-anchor="end">GPIO33 · BCLK ←</text>
    <text x="800" y="644" text-anchor="end">GPIO30 · LRCLK ←</text>
    <text x="800" y="674" text-anchor="end">GPIO31 · DATA ←</text>
    <text x="462" y="254">GPIO32 · енкодер CLK (PCNT A)</text>
    <text x="462" y="284">GPIO28 · енкодер DT (PCNT B)</text>
    <text x="462" y="314">GPIO35 · енкодер SW</text>
    <text x="462" y="354">3V3 (JP1)</text>
    <text x="462" y="384">GND</text>
    <text x="512" y="714">5V</text>
    <text x="602" y="714">GND</text>
  </g>
  <text x="800" y="330" text-anchor="end" class="sub">I2S-A · одна тактова область</text>
  <text x="800" y="590" text-anchor="end" class="sub">I2S-B · P4 раб</text>
  <text x="462" y="410" class="sub">GPIO35 на панелі вже має R34 10k ↑ і кнопку SW1 на GND</text>
  <text x="462" y="426" class="sub">(натискання будь-якої — той самий сигнал)</text>
  <text x="630" y="470" text-anchor="middle" class="sub">ES_I2C GPIO7/8 (JP1 21/23) — тач, кодек; MCP23017 пізніше</text>
  <text x="630" y="488" text-anchor="middle" class="sub">Консоль C6: JP1 18/20/22/24 (U0RXD, U0TXD, IO9, CHIP_PU)</text>
  <text x="630" y="520" text-anchor="middle" class="sub">Аудіо-GPIO гребінки: 28–35 і 49–52</text>

  <!-- ================= Encoder module ================= -->
  <rect x="60" y="180" width="280" height="250" class="mod" rx="8"/>
  <text x="200" y="204" text-anchor="middle" class="title">Модуль енкодера (KY-040-тип)</text>
  <text x="200" y="222" text-anchor="middle" class="sub">EC11 + 3 × 10k підтяжки на «+» (R1_1/R2_1/R3_1)</text>
  <g class="pad">
    <circle cx="340" cy="250" r="4"/><circle cx="340" cy="280" r="4"/><circle cx="340" cy="310" r="4"/>
    <circle cx="340" cy="350" r="4"/><circle cx="340" cy="380" r="4"/>
  </g>
  <g class="silk">
    <text x="328" y="254" text-anchor="end">CLK</text>
    <text x="328" y="284" text-anchor="end">DT</text>
    <text x="328" y="314" text-anchor="end">SW</text>
    <text x="328" y="354" text-anchor="end">+</text>
    <text x="328" y="384" text-anchor="end">GND</text>
  </g>
  <!-- wire colour swatches -->
  <g>
    <rect x="72" y="244" width="22" height="9" fill="#22A04A"/><text x="102" y="253" class="lbl">зелений</text>
    <rect x="72" y="274" width="22" height="9" fill="#E3C019"/><text x="102" y="283" class="lbl">жовтий</text>
    <rect x="72" y="304" width="22" height="9" fill="#EE8B2B"/><text x="102" y="313" class="lbl">оранжевий</text>
    <rect x="72" y="344" width="22" height="9" fill="#D9453D"/><text x="102" y="353" class="lbl">червоний</text>
    <rect x="72" y="374" width="22" height="9" fill="#8B5E3C"/><text x="102" y="383" class="lbl">коричневий</text>
  </g>
  <text x="72" y="406" class="note">4 фронти на клацання (steps_per_detent = 4)</text>
  <text x="72" y="422" class="note">Напрямок не той — `invert` у bindings.json</text>

  <!-- warning about + -->
  <rect x="60" y="446" width="280" height="64" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5" rx="8"/>
  <text x="74" y="468" class="warn">«+» → тільки 3V3 гребінки, НЕ 5 В!</text>
  <text x="74" y="486" class="note">Підтяжки 10k сидять на «+»: з 5 В на CLK/DT/SW</text>
  <text x="74" y="502" class="note">прийде 5 В і вб'є GPIO (зокрема strapping GPIO35).</text>

  <!-- ================= LDO ================= -->
  <rect x="60" y="540" width="280" height="140" class="box" rx="8"/>
  <text x="200" y="562" text-anchor="middle" class="title">Аналоговий LDO 3V3 (LP5907 і т. п.)</text>
  <text x="74" y="586" class="note">IN ← 5V з JP1 (усе разом ≤ 200–300 мА)</text>
  <text x="74" y="604" class="note">OUT 3,3 В → PCM5102A + PCM1808 «3.3» (цифра)</text>
  <text x="74" y="622" class="warn">PCM1808 «+5V» — з 5 В JP1 через ферит + кераміку</text>
  <text x="74" y="648" class="warn">Земля аналогу і плати — в одній точці біля</text>
  <text x="74" y="664" class="warn">входу підсилювача; силова земля Class-D окремо</text>

  <!-- ================= Notes ================= -->
  <rect x="60" y="700" width="330" height="250" class="box" rx="8"/>
  <text x="225" y="722" text-anchor="middle" class="title">Примітки</text>
  <text x="74" y="746" class="note">• GPIO34/35 — strapping: ніщо зовнішнє не має драйвити</text>
  <text x="74" y="762" class="note">  їх під час скидання. GPIO34: зовнішній pull-down 10k —</text>
  <text x="74" y="778" class="note">  підсилювач і DAC мовчать до старту прошивки.</text>
  <text x="74" y="800" class="note">• I2S-A: BCK/LRCK/MCLK від P4 → DAC і ADC — одна тактова</text>
  <text x="74" y="816" class="note">  область, AUX без ресемплінгу. BCK = 64fs (32-бітні слоти)</text>
  <text x="74" y="832" class="note">  — саме те, що PCM1808 чекає у slave-режимі.</text>
  <text x="74" y="854" class="note">• I2S-B: P4 раб від клоків QCC5125 → ASRC у софті.</text>
  <text x="74" y="876" class="note">• Бортовий ES8311/NS4150 не чіпаємо; PA_CTRL (GPIO11) — LOW.</text>
  <text x="74" y="898" class="note">• board.json: i2s_a / i2s_b / enc_0 / enc_sw / amp_enable.</text>
  <text x="74" y="920" class="note">• Перевірка осцилографом: MCLK 12,288 МГц, BCK 3,072 МГц,</text>
  <text x="74" y="936" class="note">  LRCK 48 кГц.</text>

  <!-- ================= PCM5102A ================= -->
  <rect x="960" y="130" width="320" height="170" class="mod" rx="8"/>
  <text x="1120" y="152" text-anchor="middle" class="title">PCM5102A — DAC</text>
  <g class="pad"><circle cx="960" cy="190" r="4"/><circle cx="960" cy="220" r="4"/><circle cx="960" cy="250" r="4"/><circle cx="960" cy="280" r="4"/></g>
  <g class="silk">
    <text x="972" y="194">BCK</text><text x="972" y="224">LRCK</text>
    <text x="972" y="254">DIN</text><text x="972" y="284">XSMT</text>
  </g>
  <text x="1040" y="176" class="note">SCK → GND (PLL від BCK)</text>
  <text x="1040" y="194" class="note">FMT → GND (I2S) · DEMP → GND</text>
  <text x="1040" y="212" class="note">FLT → GND або 3V3 (на слух)</text>
  <text x="1040" y="230" class="note">VCC ← аналоговий LDO 3V3</text>
  <text x="1040" y="254" class="note">XSMT: LOW = mute</text>
  <text x="1040" y="278" class="note">OUT L/R ≈ 2,1 В RMS →</text>
  <text x="1040" y="294" class="note">коротка траса на TPA3255</text>

  <!-- ================= TPA3255 ================= -->
  <rect x="960" y="330" width="320" height="110" class="mod" rx="8"/>
  <text x="1120" y="352" text-anchor="middle" class="title">TPA3255 — підсилювач</text>
  <g class="pad"><circle cx="960" cy="375" r="4"/></g>
  <text x="972" y="379" class="silk">/RESET</text>
  <text x="1040" y="379" class="note">через рівень 3,3 В — звірити VIH</text>
  <text x="972" y="402" class="note">IN L/R ← PCM5102A (single-ended)</text>
  <text x="972" y="420" class="note">PVDD 24–48 В власне; FAULT / CLIP_OTW → експандер (пізніше)</text>

  <!-- ================= PCM1808 module ================= -->
  <rect x="960" y="470" width="320" height="200" class="mod" rx="8" fill="#FDF4FF"/>
  <text x="1120" y="492" text-anchor="middle" class="title">PCM1808 (CJMCU) — ADC / AUX</text>
  <text x="1120" y="510" text-anchor="middle" class="sub">показано дзеркально: I2S-гребінець — на правому краю плати</text>
  <g class="pad"><circle cx="960" cy="540" r="4"/><circle cx="960" cy="570" r="4"/><circle cx="960" cy="600" r="4"/><circle cx="960" cy="630" r="4"/></g>
  <g class="silk">
    <text x="972" y="544">SCK</text><text x="972" y="574">BCK</text>
    <text x="972" y="604">LRC</text><text x="972" y="634">OUT</text>
  </g>
  <text x="1016" y="544" class="note">← системний клок 256fs (не SPI!)</text>
  <text x="1016" y="574" class="note">← бітовий клок 64fs</text>
  <text x="1016" y="604" class="note">← 48 кГц</text>
  <text x="1016" y="634" class="note">→ дані в P4 (GPIO29)</text>
  <text x="972" y="654" class="warn">MD1 = MD0 = GND (раб) · FMT = GND (I²S) · GND → спільна земля</text>
  <text x="972" y="670" class="note">+5V ← чиста 5 В (VCC) · 3.3 ← LDO (VDD) · LDO на модулі немає</text>

  <!-- analog in -->
  <rect x="960" y="690" width="320" height="76" class="box" rx="8"/>
  <text x="972" y="712" class="warn">GND — обидва піни на спільну землю з JP1!</text>
  <text x="972" y="730" class="note">Без неї: вхід P4 «висить», дані = сміття на повну шкалу,</text>
  <text x="972" y="746" class="note">а зворотний струм клоків іде сигнальними дротами → тріск</text>
  <text x="972" y="762" class="note">на ЦАПі. Перевірено на стенді 16.09.2026.</text>

  <!-- ================= QCC5125 ================= -->
  <rect x="960" y="796" width="320" height="154" class="mod" rx="8"/>
  <text x="1120" y="818" text-anchor="middle" class="title">SJR-BTM525 / QCC5125 — Bluetooth (I2S майстер)</text>
  <g class="pad"><circle cx="960" cy="848" r="4"/><circle cx="960" cy="878" r="4"/><circle cx="960" cy="908" r="4"/></g>
  <g class="silk"><text x="972" y="852">BCLK →</text><text x="972" y="882">LRCLK →</text><text x="972" y="912">DATA →</text></g>
  <text x="1056" y="852" class="note">з PIO модуля — які саме, за конфігом</text>
  <text x="1056" y="882" class="note">прошивки (див. qcc5125_module.svg)</text>
  <text x="1056" y="912" class="warn">VDD_PADS 1,8 чи 3,3 В — виміряти!</text>
  <text x="972" y="938" class="note">VBAT(14) ← LDO 2,8–4,3 В · GND(15,21,38,44) · SYS_CTRL(13) і LED(16–20) — через MCP23017</text>


  <!-- ================= GND rail — кожен модуль ОБОВ'ЯЗКОВО має спільну землю ================= -->
  <line x1="1302" y1="140" x2="1302" y2="950" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
  <text x="1316" y="150" class="silk" fill="#111827">GND</text>
  <text x="1316" y="166" class="lbl">спільна</text>
  <text x="1316" y="180" class="lbl">земля</text>
  <text x="1316" y="196" class="lbl">з JP1</text>
  <text x="1316" y="212" class="lbl">(рядок 3</text>
  <text x="1316" y="226" class="lbl">або 8)</text>
  <g stroke="#111827" stroke-width="2.5" fill="none">
    <line x1="1280" y1="142" x2="1302" y2="142"/>
    <line x1="1280" y1="344" x2="1302" y2="344"/>
    <line x1="1280" y1="482" x2="1302" y2="482"/>
    <line x1="1280" y1="808" x2="1302" y2="808"/>
  </g>
  <g fill="#111827">
    <circle cx="1302" cy="142" r="4"/><circle cx="1302" cy="344" r="4"/>
    <circle cx="1302" cy="482" r="4"/><circle cx="1302" cy="808" r="4"/>
  </g>

  <!-- ================= GND warning ================= -->
  <rect x="960" y="690" width="320" height="0" fill="none"/>
  <!-- ================= wires: I2S-A ================= -->
  <polyline points="810,160 840,160 840,540 950,540" class="w blue" marker-end="url(#aBlue)"/>
  <polyline points="810,190 870,190 950,190" class="w blue" marker-end="url(#aBlue)"/>
  <polyline points="870,190 870,570 950,570" class="w blue" marker-end="url(#aBlue)"/>
  <circle cx="870" cy="190" r="3.5" fill="#2E7FD6"/>
  <polyline points="810,220 895,220 950,220" class="w blue" marker-end="url(#aBlue)"/>
  <polyline points="895,220 895,600 950,600" class="w blue" marker-end="url(#aBlue)"/>
  <circle cx="895" cy="220" r="3.5" fill="#2E7FD6"/>
  <polyline points="810,250 950,250" class="w green" marker-end="url(#aGreen)"/>
  <text x="880" y="243" text-anchor="middle" class="lbl" fill="#2FA457">дані P4 → ЦАП</text>
  <polyline points="950,630 920,630 920,360 810,360" class="w green" marker-end="url(#aGreen)"/>
  <text x="880" y="353" text-anchor="middle" class="lbl" fill="#2FA457">дані АЦП → P4</text>
  <polyline points="810,300 940,300 940,280 950,280" class="w red" marker-end="url(#aRed)"/>
  <polyline points="940,300 940,375 950,375" class="w red" marker-end="url(#aRed)"/>
  <circle cx="940" cy="300" r="3.5" fill="#D9453D"/>
  <polyline points="1265,300 1265,330" class="w gray" marker-end="url(#aGray)"/>
  <text x="1216" y="320" class="lbl">L/R</text>

  <!-- ================= wires: QCC → I2S-B ================= -->
  <polyline points="950,848 880,848 880,610 810,610" class="w orange" marker-end="url(#aOrange)"/>
  <polyline points="950,878 865,878 865,640 810,640" class="w orange" marker-end="url(#aOrange)"/>
  <polyline points="950,908 850,908 850,670 810,670" class="w orange" marker-end="url(#aOrange)"/>

  <!-- ================= wires: encoder (по кольорах дротів) ================= -->
  <polyline points="340,250 450,250" class="w wgreen" marker-end="url(#aWire)"/>
  <polyline points="340,280 450,280" class="w wyellow" marker-end="url(#aWire)"/>
  <polyline points="340,310 450,310" class="w worange" marker-end="url(#aWire)"/>
  <polyline points="340,350 450,350" class="w wred"/>
  <polyline points="340,380 450,380" class="w wbrown"/>

  <!-- 5V → LDO -->
  <polyline points="500,710 500,760 420,760 420,690 340,690" class="w gray"/>
  <polyline points="340,690 340,660" class="w gray" marker-end="url(#aGray)"/>
  <text x="380" y="754" class="lbl">5V → LDO</text>

  <!-- legend -->
  <g transform="translate(430,880)">
    <text x="0" y="-12" class="title" font-size="13">Легенда</text>
    <line x1="0" y1="0" x2="28" y2="0" class="w blue"/><text x="34" y="4" class="lbl">I2S-A клоки (P4 →)</text>
    <line x1="0" y1="20" x2="28" y2="20" class="w green"/><text x="34" y="24" class="lbl">I2S-A дані</text>
    <line x1="0" y1="40" x2="28" y2="40" class="w orange"/><text x="34" y="44" class="lbl">I2S-B (QCC →)</text>
    <line x1="170" y1="0" x2="198" y2="0" class="w red"/><text x="204" y="4" class="lbl">amp_enable / XSMT</text>
    <line x1="170" y1="20" x2="198" y2="20" class="w gray"/><text x="204" y="24" class="lbl">живлення / земля</text>
    <line x1="170" y1="40" x2="198" y2="40" class="w wgreen"/><text x="204" y="44" class="lbl">енкодер (колір = колір дроту)</text>
  </g>
</svg>
