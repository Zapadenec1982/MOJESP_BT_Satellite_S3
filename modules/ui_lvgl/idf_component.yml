dependencies:
  lvgl/lvgl: "~9.3.0"
  # esp_lvgl_port: LVGL task + display (MIPI-DSI) + touch glue. Its touch API
  # (lvgl_port_touch_cfg_t) only exists when esp_lcd_touch.h is visible in the including
